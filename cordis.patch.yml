# Bridge the verified Codebase Memory runtime into DSH as native MCP tools
# and register the file-system watcher that keeps the graph fresh.
- insert:
    - id: mcp-codebase-memory
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: codebase_memory
        transport: stdio
# Runtime resolution:
#   1. CODEBASE_MEMORY_MCP_BIN — an explicit override for non-standard installs
#   2. "codebase-memory-mcp" — resolved through PATH, which is where every
#      documented Linux channel puts it (~/.local/bin via install.sh, npm -g
#      via the npm bin directory; Windows resolves the .exe/.cmd through
#      PATHEXT)
# There is deliberately no npx fallback here: spawn() does not retry a second
# command, so a PATH miss fails fast with a clear error instead of silently
# launching a downloader that needs GitHub release-asset access. The watcher
# bundle below DOES implement the npx fallback in src/cli-bridge.mjs.
# The !!js expressions below can only use Node globals: the loader evaluates
# them with `with (ctx) { eval(expr) }`, so require/fs are NOT in scope.
        command: !!js >-
          process.env.CODEBASE_MEMORY_MCP_BIN || "codebase-memory-mcp"
        cwd: !!js >-
          (process.env.TMPDIR || process.env.TEMP || "/tmp") + "/dsh-codebase-memory-session"
        toolCallTimeoutMs: 600000
# Keep the Host booting even when the runtime is missing; the watcher still
# works and the startup error is logged instead of killing plugin load.
        failOnStartupError: false
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 30000
          maxAttempts: 10

    # Watcher: same package, different bundle id so its setup() runs as a
    # standalone plugin without competing with the MCP-client bridge above.
    - id: dsh-codebase-memory-watcher
      name: dsh-codebase-memory
      config:
        enabled: true
        autoAttach: true
        defaultDebounceMs: 5000
        defaultMode: moderate
        usePolling: false
        ignored:
          - "**/node_modules/**"
          - "**/.git/**"
          - "**/dist/**"
          - "**/build/**"
          - "**/.next/**"
          - "**/.turbo/**"
          - "**/.codebase-memory/**"
          - "**/.pnpm-store/**"
          - "**/target/**"
          - "**/__pycache__/**"
          - "**/.venv/**"
        watchedExtensions:
          - .ts
          - .tsx
          - .js
          - .jsx
          - .mjs
          - .cjs
          - .py
          - .go
          - .rs
          - .java
          - .cs
          - .rb
          - .php
          - .sh
          - .vue
          - .svelte
